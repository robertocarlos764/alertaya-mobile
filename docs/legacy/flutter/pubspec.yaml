name: alertaya
description: AlertaYA - Personal Security App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  animate_do: ^3.3.4
  shared_preferences: ^2.2.2
  get: ^4.6.6
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.2.0
  geolocator: ^11.0.0
  permission_handler: ^11.3.0
  intl: ^0.19.0
